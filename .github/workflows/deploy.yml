name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# One deploy at a time, in push order, so the Ledger records commits in sequence.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

      # web first: datspace-ai's WEB service binding needs datspace-web to exist.
      - name: Deploy datspace-web
        run: pnpm --filter @datspace/web exec wrangler deploy
      - name: Deploy datspace-ai
        run: pnpm --filter @datspace/ai exec wrangler deploy

      - name: Record the deploy in the Ledger
        env:
          AI_URL: ${{ vars.AI_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "$AI_URL/admin/deploy" \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"commit\":\"$GITHUB_SHA\"}" \
            | jq '{seq: .event.seq, commit: .event.data.commit, hash: .event.hash}'

      # axe-core in the runner's Chrome, against the pages just deployed.
      - name: Check accessibility
        env:
          WEB_URL: ${{ vars.WEB_URL }}
        run: pnpm check:a11y
